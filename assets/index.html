<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ahşap ve Epoksi Puzzle</title>
  <style>
    :root {
      --bg-dark: #0b0907;
      --panel-bg: #17120e;
      --panel-border: #38281b;
      --wood-light: #d79b60;
      --wood-mid: #b3733b;
      --wood-dark: #6c3e1b;
      --epoxy-teal: #187a7a;
      --epoxy-light: #35b2aa;
      --gold: #f5b942;
      --text-main: #f7efe6;
      --text-muted: #b8a592;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: radial-gradient(circle at top, #1d150f 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 12px;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6ee7b7;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-btn.gold {
      background: rgba(245, 185, 66, 0.16);
      border-color: rgba(245, 185, 66, 0.45);
      color: #ffd670;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-val {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .stat-val.gold {
      color: var(--gold);
    }

    .scene-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scene-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .level-badge {
      background: rgba(215, 155, 96, 0.18);
      border: 1px solid rgba(215, 155, 96, 0.45);
      color: #f6c88d;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 8px;
    }

    .correct-badge {
      font-size: 12px;
      font-weight: 700;
      color: #7ee7b7;
    }

    .scene-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .scene-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-action {
      background: none;
      border: none;
      color: #e9c496;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .target-thumb {
      width: 66px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(245, 185, 66, 0.65);
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    .target-thumb span {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.72);
      color: #ffd670;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .board-frame {
      background: linear-gradient(145deg, #2a190d, #150d07);
      border: 2px solid #4c301a;
      box-shadow: 0 0 0 1px rgba(53, 178, 170, 0.28), 0 12px 28px rgba(0, 0, 0, 0.65);
      border-radius: 18px;
      padding: 10px;
    }

    .board-grid {
      display: grid;
      gap: 7px;
      width: 100%;
    }

    .tile {
      position: relative;
      aspect-ratio: 1.15 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 224, 178, 0.22);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .tile:active {
      transform: scale(0.97);
    }

    .tile.selected {
      border-color: #35b2aa;
      box-shadow: 0 0 0 2px rgba(53, 178, 170, 0.75);
      transform: scale(1.02);
      z-index: 2;
    }

    .tile.correct {
      border-color: #f5b942;
      box-shadow: 0 0 0 1px rgba(245, 185, 66, 0.55);
    }

    .check-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      color: #1c1208;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .hint-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .powerups-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .power-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      color: var(--text-main);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .power-cost {
      background: rgba(245, 185, 66, 0.16);
      color: #ffd670;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
    }

    .reward-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      background: linear-gradient(90deg, #e09f3e 0%, #f5b942 45%, #249e94 100%);
      color: #120d07;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 20px rgba(36, 158, 148, 0.28);
    }

    .reward-chip {
      background: rgba(0, 0, 0, 0.22);
      color: #fff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 30;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #1b140e;
      border: 1px solid #4a3320;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .primary-btn {
      background: linear-gradient(135deg, #27a86b, #1c8554);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      flex: 1;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #f7efe6;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-strip">
      <div class="status-dot" id="adStatus">Reklam Hazır</div>
      <div class="top-actions">
        <button class="pill-btn" id="soundBtn" title="Ses Aç/Kapat">🔊 Ses Açık</button>
        <button class="pill-btn" id="backupBtn">☁️ Yedek</button>
        <button class="pill-btn gold" id="removeAdsBtn">Reklam Kaldır</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Bölüm</div>
        <div class="stat-val" id="levelText">1/50</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Puan</div>
        <div class="stat-val gold" id="scoreText">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hamle</div>
        <div class="stat-val" id="movesText">8</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kasa</div>
        <div class="stat-val gold" id="chestText">0/9 ★</div>
      </div>
    </div>

    <div class="scene-card">
      <div class="scene-top">
        <span class="level-badge" id="tierBadge">1. KADEME • 3×2</span>
        <span class="correct-badge" id="correctText">0/6 Doğru</span>
      </div>
      <div class="scene-title" id="sceneTitle">1. Gün Batımı Fiyort &amp; Yelkenli</div>
      <div class="scene-meta">
        <div class="meta-actions">
          <button class="link-action" id="goalBtn">🔍 Hedefi Gör</button>
          <button class="link-action" id="dailyBtn">📅 Günlük Bulmaca</button>
        </div>
        <div class="target-thumb" id="thumbBox" title="Hedefi Gör">
          <canvas id="thumbCanvas" width="132" height="88" style="width:100%;height:100%;display:block;"></canvas>
          <span>HEDEF</span>
        </div>
      </div>
    </div>

    <div class="board-frame">
      <div class="board-grid" id="boardGrid"></div>
    </div>

    <div class="hint-bar">
      <span>Dokun veya seç • Doğru yer yıldızlanır</span>
      <span id="gridInfo">3×2 Kasa (6 Parça)</span>
    </div>

    <div class="powerups-row">
      <button class="power-btn" id="hintBtn">
        <span>💡 İpucu Al</span>
        <span class="power-cost">250 Puan</span>
      </button>
      <button class="power-btn" id="extraMoveBtn">
        <span>⚡ +2 Hamle</span>
        <span class="power-cost">350 Puan</span>
      </button>
    </div>

    <button class="reward-btn" id="rewardBtn">
      <span id="rewardBtnLabel">🎬 Reklam İzle (+1 Hamle)</span>
      <span class="reward-chip" id="rewardChip">+1 Hamle 🎁</span>
    </button>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box">
      <h3 id="modalTitle" style="margin:0;color:#ffd670;">Hedef Sahne</h3>
      <canvas id="modalCanvas" width="300" height="200" style="width:100%;border-radius:12px;display:none;"></canvas>
      <p id="modalDesc" style="margin:0;font-size:13px;color:#e7dacb;line-height:1.45;"></p>
      <div class="modal-actions" id="modalActions">
        <button class="primary-btn" id="modalCloseBtn">Tamam</button>
      </div>
    </div>
  </div>

  <script>
     
    const SCENES = [
      {
        title: "Gün Batımı Fiyort & Yelkenli",
        skyTop: "#e68a3e",
        skyBot: "#f6c47e",
        woodA: "#8c4a1b",
        waterTop: "#1b7f8e",
        waterBot: "#0d4754",
        woodB: "#5c2c10",
        pine: "#183a2c",
        sail: "#fff7e8",
        ring: "#ffd17c"
      },
      {
        title: "Zümrüt Epoksi & Çam Vadisi",
        skyTop: "#2f7a6d",
        skyBot: "#79c2b0",
        woodA: "#1b4d44",
        waterTop: "#0fa37f",
        waterBot: "#074f3e",
        woodB: "#4a2e1b",
        pine: "#0f3822",
        sail: "#e9fff8",
        ring: "#7ef5d4"
      },
      {
        title: "Kehribar Gün Doğumu & Kıyı",
        skyTop: "#d96b27",
        skyBot: "#f7b24a",
        woodA: "#7a3812",
        waterTop: "#c98a2e",
        waterBot: "#5c3a14",
        woodB: "#42210b",
        pine: "#3d2b1f",
        sail: "#fff2cc",
        ring: "#ffe082"
      },
      {
        title: "Kuzey Fiyordu & Ahşap Köprü",
        skyTop: "#3b6998",
        skyBot: "#8bb8e8",
        woodA: "#244363",
        waterTop: "#2b8cbe",
        waterBot: "#123b5c",
        woodB: "#5a3821",
        pine: "#1d3f35",
        sail: "#f0f8ff",
        ring: "#a6dcff"
      }
    ];

    
    const SoundFX = {
      ctx: null,
      masterGain: null,
      compressor: null,
      enabled: true,
      ensureContext() {
        if (!this.enabled) return null;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!this.ctx) {
          this.ctx = new AudioCtx();

          this.compressor = this.ctx.createDynamicsCompressor();
          this.compressor.threshold.setValueAtTime(-14, this.ctx.currentTime);
          this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
          this.compressor.ratio.setValueAtTime(6, this.ctx.currentTime);
          this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
          this.compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(1.45, this.ctx.currentTime);

          this.compressor.connect(this.masterGain);
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },
      tone(freq, duration, type = "sine", gainVal = 0.45, delay = 0, endFreq = null) {
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq !== null) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), now + duration);
        }
        gain.gain.setValueAtTime(0.0008, now);
        gain.gain.exponentialRampToValueAtTime(Math.min(0.85, gainVal), now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
        osc.connect(gain);
        gain.connect(this.compressor);
        osc.start(now);
        osc.stop(now + duration + 0.025);
      },
      tap() {
        this.tone(260, 0.08, "triangle", 0.48, 0, 175);
      },
      swap() {
        this.tone(330, 0.09, "triangle", 0.46, 0, 390);
        this.tone(460, 0.1, "sine", 0.48, 0.045, 520);
      },
      correct() {
        this.tone(523.25, 0.13, "triangle", 0.52, 0);
        this.tone(659.25, 0.18, "sine", 0.55, 0.065);
      },
      win() {
        this.tone(523.25, 0.15, "triangle", 0.56, 0);
        this.tone(659.25, 0.15, "triangle", 0.56, 0.1);
        this.tone(783.99, 0.15, "triangle", 0.56, 0.2);
        this.tone(1046.5, 0.32, "sine", 0.62, 0.3);
      },
      reward() {
        this.tone(587.33, 0.13, "triangle", 0.52, 0);
        this.tone(880.0, 0.24, "sine", 0.58, 0.09);
      },
      warn() {
        this.tone(210, 0.18, "triangle", 0.45, 0, 145);
      }
    };

    const state = {
      level: 1,
      score: 0,
      moves: 8,
      stars: 0,
      selectedIndex: null,
      tiles: []
    };

        function getLevelConfig(lvl) {
      if (lvl <= 10) {
        return { tier: "1. KADEME", cols: 3, rows: 2, startMoves: 5, adBonusMoves: 1 };
      }
      if (lvl <= 20) {
        return { tier: "2. KADEME", cols: 3, rows: 3, startMoves: 8, adBonusMoves: 1 };
      }
      if (lvl <= 30) {
        return { tier: "3. KADEME", cols: 4, rows: 4, startMoves: 14, adBonusMoves: 2 };
      }
      return { tier: "4. KADEME", cols: 5, rows: 5, startMoves: 24, adBonusMoves: 2 };
    }


    function drawPiece(canvas, sceneIdx, pieceIdx, cols, rows) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
                  const sceneIndex = ((sceneIdx - 1) % SCENES.length + SCENES.length) % SCENES.length;
      const lvlNum = (typeof state !== "undefined" && state.level) ? state.level : sceneIdx;

      const col = pieceIdx % cols;
      const row = Math.floor(pieceIdx / cols);
      const fullW = Math.max(1, w * cols);
      const fullH = Math.max(1, h * rows);

      ctx.save();
      try {
        ctx.translate(-col * w, -row * h);

        const woodPalettes = [
          { light: "#a16a41", mid: "#784720", dark: "#47280f", grain: "rgba(36, 16, 5, 0.42)" },
          { light: "#d19960", mid: "#a6733a", dark: "#66461d", grain: "rgba(56, 32, 8, 0.38)" },
          { light: "#bf6741", mid: "#914625", dark: "#5c1f05", grain: "rgba(48, 18, 3, 0.40)" },
          { light: "#e0ad6b", mid: "#b38639", dark: "#735515", grain: "rgba(60, 36, 6, 0.35)" },
          { light: "#ad8c64", mid: "#82663f", dark: "#4d391d", grain: "rgba(40, 26, 8, 0.42)" }
        ];
        const wood = woodPalettes[Math.abs(lvlNum + sceneIndex) % woodPalettes.length];

        const epoxyPalettes = [
          { top: "#14b8a6", bot: "#064e3b", glow: "rgba(153, 246, 228, 0.65)", swirl: "rgba(240, 253, 250, 0.45)" },
          { top: "#0284c7", bot: "#0c2d48", glow: "rgba(125, 211, 252, 0.62)", swirl: "rgba(235, 251, 255, 0.42)" },
          { top: "#10b981", bot: "#064e3b", glow: "rgba(167, 243, 208, 0.62)", swirl: "rgba(238, 255, 248, 0.42)" },
          { top: "#a78bfa", bot: "#5b21b6", glow: "rgba(221, 214, 255, 0.68)", swirl: "rgba(250, 245, 255, 0.48)" },
          { top: "#d97706", bot: "#78350f", glow: "rgba(253, 230, 138, 0.68)", swirl: "rgba(255, 251, 235, 0.48)" }
        ];
        const epoxy = epoxyPalettes[Math.abs(lvlNum * 2 + sceneIndex) % epoxyPalettes.length];

        const woodGrad = ctx.createLinearGradient(0, 0, fullW, fullH);
        woodGrad.addColorStop(0, wood.light);
        woodGrad.addColorStop(0.5, wood.mid);
        woodGrad.addColorStop(1, wood.dark);
        ctx.fillStyle = woodGrad;
        ctx.fillRect(0, 0, fullW, fullH);

        ctx.strokeStyle = wood.grain;
        const grainMode = Math.abs(lvlNum * 3 + sceneIndex * 2) % 3;
        for (let i = -60; i < fullH + 60; i += 10) {
          ctx.lineWidth = (Math.abs(i) % 20 === 0) ? 2.8 : 1.4;
          ctx.beginPath();
          if (grainMode === 0) {
            ctx.moveTo(0, i);
            ctx.bezierCurveTo(fullW * 0.3, i - 12, fullW * 0.7, i + 12, fullW, i);
          } else if (grainMode === 1) {
            ctx.moveTo(0, i * 0.9);
            ctx.bezierCurveTo(fullW * 0.4, i * 0.9 - 10, fullW * 0.6, i * 0.9 + 10, fullW, i * 0.9);
          } else {
            ctx.moveTo(0, i + (Math.abs(i) % 16 === 0 ? 15 : -15));
            ctx.bezierCurveTo(fullW * 0.2, i - 18, fullW * 0.8, i + 18, fullW, i);
          }
          ctx.stroke();
        }

        const knotX = fullW * (0.25 + (Math.abs(lvlNum * 57) % 50) / 100);
        const knotY = fullH * (0.28 + (Math.abs(lvlNum * 41) % 44) / 100);
        for (let k = 1; k <= 3; k++) {
          ctx.strokeStyle = wood.grain;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(knotX, knotY, k * 10, k * 5, (Math.abs(lvlNum) % 6) * 0.3, 0, Math.PI * 2);
          ctx.stroke();
        }

        const riverMode = Math.abs(lvlNum) % 4;
        const epoxyGrad = ctx.createRadialGradient(fullW * 0.5, fullH * 0.5, fullW * 0.1, fullW * 0.5, fullH * 0.5, fullW * 0.7);
        epoxyGrad.addColorStop(0, epoxy.top);
        epoxyGrad.addColorStop(1, epoxy.bot);

        ctx.save();
        try {
          ctx.beginPath();
          if (riverMode === 0) {
            ctx.moveTo(0, fullH * 0.55);
            ctx.bezierCurveTo(fullW * 0.3, fullH * 0.35, fullW * 0.7, fullH * 0.75, fullW, fullH * 0.45);
            ctx.lineTo(fullW, fullH);
            ctx.lineTo(0, fullH);
          } else if (riverMode === 1) {
            ctx.ellipse(fullW * 0.5, fullH * 0.48, fullW * 0.38, fullH * 0.30, ((Math.abs(lvlNum) % 2) - 1) * 0.2, 0, Math.PI * 2);
          } else if (riverMode === 2) {
            ctx.moveTo(fullW * 0.15, 0);
            ctx.quadraticCurveTo(fullW * 0.7, fullH * 0.15, fullW * 0.9, fullH * 0.7);
            ctx.bezierCurveTo(fullW * 0.8, fullH * 0.9, fullW * 0.4, fullH * 1.0, 0, fullH * 0.75);
            ctx.lineTo(0, fullH);
            ctx.lineTo(fullW, fullH);
            ctx.lineTo(fullW, 0);
          } else {
            ctx.moveTo(fullW * 0.05, fullH * 0.4);
            ctx.bezierCurveTo(fullW * 0.25, fullH * 0.2, fullW * 0.75, fullH * 0.6, fullW * 0.95, fullH * 0.45);
            ctx.lineTo(fullW * 0.95, fullH * 0.9);
            ctx.bezierCurveTo(fullW * 0.75, fullH * 0.95, fullW * 0.25, fullH * 0.85, fullW * 0.05, fullH * 0.9);
          }
          ctx.closePath();
          ctx.fillStyle = epoxyGrad;
          ctx.fill();

          ctx.strokeStyle = epoxy.glow;
          ctx.lineWidth = 6.0;
          ctx.stroke();

          ctx.clip();
          ctx.strokeStyle = epoxy.swirl;
          ctx.lineWidth = 3.5;
          const swirlCount = 3 + (Math.abs(lvlNum) % 3);
          for (let s = 0; s < swirlCount; s++) {
            const sy = fullH * (0.18 + s * (0.64 / swirlCount));
            ctx.beginPath();
            ctx.moveTo(0, sy);
            ctx.bezierCurveTo(
              fullW * 0.33, sy + ((s + lvlNum) % 2 === 0 ? 25 : -25),
              fullW * 0.66, sy + ((s + lvlNum) % 2 === 0 ? -25 : 25),
              fullW, sy
            );
            ctx.stroke();
          }

          const sunRadius = 28 + (Math.abs(lvlNum) % 8);
          const sunX = fullW * (0.80 - (Math.abs(lvlNum * 7) % 20) / 100);
          const sunY = fullH * (0.22 - (Math.abs(lvlNum * 11) % 15) / 100);
          ctx.fillStyle = "rgba(255, 251, 235, 0.75)";
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(253, 230, 138, 0.5)";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunRadius + 6, 0, Math.PI * 2);
          ctx.stroke();

          const pineCount = 2 + (Math.abs(lvlNum * 4) % 4);
          for (let i = 0; i < pineCount; i++) {
            const tx = fullW * (0.10 + (Math.abs(i * 37 + lvlNum * 29) % 78) / 100);
            const ty = fullH * (0.55 + (Math.abs(i * 17 + lvlNum * 13) % 30) / 100);
            const hTree = 25 + (Math.abs(i * 11 + lvlNum * 7) % 25);
            const wTree = 12 + (Math.abs(i * 7 + lvlNum * 5) % 12);
            ctx.fillStyle = wood.dark;
            ctx.beginPath();
            ctx.moveTo(tx, ty - hTree);
            ctx.lineTo(tx - wTree, ty);
            ctx.lineTo(tx + wTree, ty);
            ctx.closePath();
            ctx.fill();
          }

          const bx = fullW * (0.38 + (Math.abs(lvlNum * 19) % 40) / 100);
          const by = fullH * (0.65 + (Math.abs(lvlNum * 17) % 22) / 100);
          const bDir = (lvlNum % 2 === 0) ? 1 : -1;
          const bScale = 0.9 + (Math.abs(lvlNum) % 3) * 0.3;
          ctx.fillStyle = "#fef3c7";
          ctx.beginPath();
          ctx.moveTo(bx, by - 40 * bScale);
          ctx.lineTo(bx + 35 * bScale * bDir, by - 5 * bScale);
          ctx.lineTo(bx, by - 5 * bScale);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = wood.dark;
          ctx.fillRect(bx - (bDir === 1 ? 18 : 42) * bScale, by - 5 * bScale, 50 * bScale, 9 * bScale);

          const ringCount = 1 + (Math.abs(lvlNum * 5) % 6);
          for (let r = 0; r < ringCount; r++) {
            const rx = fullW * (0.15 + (Math.abs(r * 33 + lvlNum * 25) % 74) / 100);
            const ry = fullH * (0.35 + (Math.abs(r * 17 + lvlNum * 13) % 50) / 100);
            const radX = 18 + (r % 5) * 6;
            const radY = 7 + (r % 4) * 3;
            const rot = (Math.abs(r + lvlNum) * 0.8) % Math.PI;
            ctx.strokeStyle = epoxy.glow;
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.ellipse(rx, ry, radX, radY, rot, 0, Math.PI * 2);
            ctx.stroke();
          }
        } finally {
          ctx.restore();
        }

        ctx.strokeStyle = "rgba(250, 250, 250, 0.3)";
        ctx.lineWidth = 3.0;
        ctx.strokeRect(col * w + 1.5, row * h + 1.5, Math.max(0, w - 3), Math.max(0, h - 3));
        ctx.strokeStyle = "rgba(30, 30, 30, 0.3)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(col * w + 3, row * h + 3, Math.max(0, w - 6), Math.max(0, h - 6));
      } finally {
        ctx.restore();
      }
    }

          const sceneIndex = ((sceneIdx - 1) % SCENES.length + SCENES.length) % SCENES.length;
      const lvlNum = (typeof state !== "undefined" && state.level) ? state.level : sceneIdx;

      const col = pieceIdx % cols;
      const row = Math.floor(pieceIdx / cols);
      const fullW = w * cols;
      const fullH = h * rows;

      ctx.save();
      ctx.translate(-col * w, -row * h);

      // 1. Doğal Ahşap Paletleri (Ceviz, Meşe, Maun, Tik, Zeytin) - Daha sıcak tonlar
      const woodPalettes = [
        { light: "#a16a41", mid: "#784720", dark: "#47280f", grain: "rgba(36, 16, 5, 0.42)" }, // Koyu Ceviz
        { light: "#d19960", mid: "#a6733a", dark: "#66461d", grain: "rgba(56, 32, 8, 0.38)" }, // Bal Meşe
        { light: "#bf6741", mid: "#914625", dark: "#5c1f05", grain: "rgba(48, 18, 3, 0.40)" }, // Maun
        { light: "#e0ad6b", mid: "#b38639", dark: "#735515", grain: "rgba(60, 36, 6, 0.35)" }, // Altın Tik
        { light: "#ad8c64", mid: "#82663f", dark: "#4d391d", grain: "rgba(40, 26, 8, 0.42)" }  // Zeytin
      ];
      const wood = woodPalettes[(lvlNum + sceneIndex) % woodPalettes.length];

      // 2. Parlak Epoksi Reçine Paletleri (Turkuaz, Zümrüt, Okyanus, Ametist, Kehribar) - Daha canlı ve ışıltılı
      const epoxyPalettes = [
        { top: "#14b8a6", bot: "#064e3b", glow: "rgba(153, 246, 228, 0.65)", swirl: "rgba(240, 253, 250, 0.45)" }, // Turkuaz
        { top: "#0284c7", bot: "#0c2d48", glow: "rgba(125, 211, 252, 0.62)", swirl: "rgba(235, 251, 255, 0.42)" }, // Okyanus
        { top: "#10b981", bot: "#064e3b", glow: "rgba(167, 243, 208, 0.62)", swirl: "rgba(238, 255, 248, 0.42)" }, // Zümrüt
        { top: "#a78bfa", bot: "#5b21b6", glow: "rgba(221, 214, 255, 0.68)", swirl: "rgba(250, 245, 255, 0.48)" }, // Ametist (Mor)
        { top: "#d97706", bot: "#78350f", glow: "rgba(253, 230, 138, 0.68)", swirl: "rgba(255, 251, 235, 0.48)" }  // Kehribar
      ];
      const epoxy = epoxyPalettes[(lvlNum * 2 + sceneIndex) % epoxyPalettes.length];

      // 3. Alt Katman: Doğal Ahşap Zemin + Gerçekçi Dokular
      const woodGrad = ctx.createLinearGradient(0, 0, fullW, fullH);
      woodGrad.addColorStop(0, wood.light);
      woodGrad.addColorStop(0.5, wood.mid);
      woodGrad.addColorStop(1, wood.dark);
      ctx.fillStyle = woodGrad;
      ctx.fillRect(0, 0, fullW, fullH);

      // Ahşap lifleri / damar çizgileri - Daha organik ve rastgele
      ctx.strokeStyle = wood.grain;
      const grainMode = (lvlNum * 3 + sceneIndex * 2) % 3;
      for (let i = -60; i < fullH + 60; i += 10) {
        ctx.lineWidth = (i % 20 === 0) ? 2.8 : 1.4;
        ctx.beginPath();
        if (grainMode === 0) {
          ctx.moveTo(0, i);
          ctx.bezierCurveTo(fullW * 0.3, i - 12, fullW * 0.7, i + 12, fullW, i);
        } else if (grainMode === 1) {
          ctx.moveTo(0, i * 0.9);
          ctx.bezierCurveTo(fullW * 0.4, i * 0.9 - 10, fullW * 0.6, i * 0.9 + 10, fullW, i * 0.9);
        } else {
          ctx.moveTo(0, i + (i%16===0?15:-15));
          ctx.bezierCurveTo(fullW * 0.2, i - 18, fullW * 0.8, i + 18, fullW, i);
        }
        ctx.stroke();
      }

      // Ahşap budak halkası - Daha rastgele ve belirgin
      const knotX = fullW * (0.25 + ((lvlNum * 57) % 50) / 100);
      const knotY = fullH * (0.28 + ((lvlNum * 41) % 44) / 100);
      for (let k = 1; k <= 3; k++) {
        ctx.strokeStyle = wood.grain;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(knotX, knotY, k * 10, k * 5, (lvlNum % 6) * 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 4. Epoksi Reçine Formu - Daha akışkan ve organik
      const riverMode = lvlNum % 4;
      const epoxyGrad = ctx.createRadialGradient(fullW * 0.5, fullH * 0.5, fullW * 0.1, fullW * 0.5, fullH * 0.5, fullW * 0.7);
      epoxyGrad.addColorStop(0, epoxy.top);
      epoxyGrad.addColorStop(1, epoxy.bot);

      ctx.save();
      ctx.beginPath();
      if (riverMode === 0) {
        // Kavisli epoksi nehri
        ctx.moveTo(0, fullH * 0.55);
        ctx.bezierCurveTo(fullW * 0.3, fullH * 0.35, fullW * 0.7, fullH * 0.75, fullW, fullH * 0.45);
        ctx.lineTo(fullW, fullH);
        ctx.lineTo(0, fullH);
      } else if (riverMode === 1) {
        // Merkezden yayılan epoksi adası
        ctx.ellipse(fullW * 0.5, fullH * 0.48, fullW * 0.38, fullH * 0.30, ((lvlNum % 2) - 1) * 0.2, 0, Math.PI * 2);
      } else if (riverMode === 2) {
        // Çapraz akan epoksi koyu
        ctx.moveTo(fullW * 0.15, 0);
        ctx.quadraticCurveTo(fullW * 0.7, fullH * 0.15, fullW * 0.9, fullH * 0.7);
        ctx.bezierCurveTo(fullW * 0.8, fullH * 0.9, fullW * 0.4, fullH * 1.0, 0, fullH * 0.75);
        ctx.lineTo(0, fullH);
        ctx.lineTo(fullW, fullH);
        ctx.lineTo(fullW, 0);
      } else {
        // Organik epoksi havuzu
        ctx.moveTo(fullW * 0.05, fullH * 0.4);
        ctx.bezierCurveTo(fullW * 0.25, fullH * 0.2, fullW * 0.75, fullH * 0.6, fullW * 0.95, fullH * 0.45);
        ctx.lineTo(fullW * 0.95, fullH * 0.9);
        ctx.bezierCurveTo(fullW * 0.75, fullH * 0.95, fullW * 0.25, fullH * 0.85, fullW * 0.05, fullH * 0.9);
      }
      ctx.closePath();
      ctx.fillStyle = epoxyGrad;
      ctx.fill();

      // Epoksi-Ahşap birleşimine parlak, kalın reçine kenar
      ctx.strokeStyle = epoxy.glow;
      ctx.lineWidth = 6.0;
      ctx.stroke();

      // Epoksi içine gömülü sedefli reçine girdapları
      ctx.clip();
      ctx.strokeStyle = epoxy.swirl;
      ctx.lineWidth = 3.5;
      const swirlCount = 3 + (lvlNum % 3);
      for (let s = 0; s < swirlCount; s++) {
        const sy = fullH * (0.18 + s * (0.64 / swirlCount));
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.bezierCurveTo(
          fullW * 0.33, sy + ((s + lvlNum) % 2 === 0 ? 25 : -25),
          fullW * 0.66, sy + ((s + lvlNum) % 2 === 0 ? -25 : 25),
          fullW, sy
        );
        ctx.stroke();
      }

      // 5. Epoksi İçine Gömülü Figürler - Daha belirgin
      // Güneş veya Ay diski
      const sunRadius = 28 + (lvlNum % 8);
      const sunX = fullW * (0.80 - ((lvlNum * 7) % 20) / 100);
      const sunY = fullH * (0.22 - ((lvlNum * 11) % 15) / 100);
      ctx.fillStyle = "rgba(255, 251, 235, 0.75)";
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(253, 230, 138, 0.5)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius + 6, 0, Math.PI * 2);
      ctx.stroke();

      // Çam ağacı silüetleri
      const pineCount = 2 + ((lvlNum * 4) % 4);
      for (let i = 0; i < pineCount; i++) {
        const tx = fullW * (0.10 + ((i * 37 + lvlNum * 29) % 78) / 100);
        const ty = fullH * (0.55 + ((i * 17 + lvlNum * 13) % 30) / 100);
        const hTree = 25 + ((i * 11 + lvlNum * 7) % 25);


    function setupLevel(lvl) {
      const cfg = getLevelConfig(lvl);
      const total = cfg.cols * cfg.rows;
      const arr = Array.from({ length: total }, (_, i) => i);

      do {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      } while (arr.every((v, idx) => v === idx));

      state.level = lvl;
      state.moves = cfg.startMoves;
      state.selectedIndex = null;
      state.tiles = arr;
      render();
    }

    function grantRewardedMoves() {
      const cfg = getLevelConfig(state.level);
      state.moves += cfg.adBonusMoves;
      document.getElementById("adStatus").textContent = `+${cfg.adBonusMoves} Hamle Eklendi`;
      SoundFX.reward();
      closeModal();
      render();
    }

    function onOutOfMoves() {
      const cfg = getLevelConfig(state.level);
      SoundFX.warn();
      openModal(
        "Hamle Sınırı Doldu",
        `Reklam izleyerek +${cfg.adBonusMoves} hamle kazanıp kaldığınız yerden devam edebilir veya bölümü yeniden başlatabilirsiniz.`,
        false,
        [
          {
            label: `🎬 Reklam İzle (+${cfg.adBonusMoves} Hamle)`,
            className: "primary-btn",
            onClick: () => grantRewardedMoves()
          },
          {
            label: "Yeniden Başla",
            className: "secondary-btn",
            onClick: () => {
              closeModal();
              setupLevel(state.level);
            }
          }
        ]
      );
    }

    function swapTiles(a, b) {
      if (a === b || state.moves <= 0) return;
      [state.tiles[a], state.tiles[b]] = [state.tiles[b], state.tiles[a]];
      state.moves -= 1;
      state.selectedIndex = null;

      if (state.tiles[b] === b) {
        state.score += 100;
        SoundFX.correct();
      } else {
        SoundFX.swap();
      }

      const solved = state.tiles.every((val, idx) => val === idx);
      if (solved) {
        state.score += 300;
        state.stars = Math.min(9, state.stars + 1);
        SoundFX.win();
        const nextLvl = state.level < 50 ? state.level + 1 : 1;
        openModal(
          "Bölüm Tamamlandı!",
          `${state.level}. bölümü tamamladınız! +300 puan ve +1 yıldız kazandınız.`,
          false,
          [
            {
              label: "Sonraki Bölüm",
              className: "primary-btn",
              onClick: () => {
                closeModal();
                setupLevel(nextLvl);
              }
            }
          ]
        );
        return;
      }

      if (state.moves <= 0) {
        render();
        onOutOfMoves();
        return;
      }

      render();
    }

    function render() {
      const cfg = getLevelConfig(state.level);
      const scene = SCENES[(state.level - 1) % SCENES.length];
      const total = cfg.cols * cfg.rows;
      const correctCount = state.tiles.filter((val, idx) => val === idx).length;

      document.getElementById("levelText").textContent = `${state.level}/50`;
      document.getElementById("scoreText").textContent = `${state.score}`;
      document.getElementById("movesText").textContent = `${state.moves}`;
      document.getElementById("chestText").textContent = `${state.stars}/9 ★`;
      document.getElementById("tierBadge").textContent = `${cfg.tier} • ${cfg.cols}×${cfg.rows}`;
      document.getElementById("correctText").textContent = `${correctCount}/${total} Doğru`;
      document.getElementById("sceneTitle").textContent = `${state.level}. ${scene.title}`;
      document.getElementById("gridInfo").textContent = `${cfg.cols}×${cfg.rows} Kasa (${total} Parça)`;
      document.getElementById("rewardBtnLabel").textContent = `🎬 Reklam İzle (+${cfg.adBonusMoves} Hamle)`;
      document.getElementById("rewardChip").textContent = `+${cfg.adBonusMoves} Hamle 🎁`;

      drawPiece(document.getElementById("thumbCanvas"), state.level, 0, 1, 1);

      const grid = document.getElementById("boardGrid");
      grid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
      grid.innerHTML = "";

      state.tiles.forEach((pieceVal, idx) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        if (state.selectedIndex === idx) tile.classList.add("selected");
        if (pieceVal === idx) tile.classList.add("correct");

        const c = document.createElement("canvas");
        c.width = 160;
        c.height = 140;
        c.style.width = "100%";
        c.style.height = "100%";
        c.style.display = "block";
        drawPiece(c, state.level, pieceVal, cfg.cols, cfg.rows);
        tile.appendChild(c);

        if (pieceVal === idx) {
          const badge = document.createElement("div");
          badge.className = "check-badge";
          badge.textContent = "✓";
          tile.appendChild(badge);
        }

        tile.addEventListener("click", () => {
          if (state.selectedIndex === null) {
            state.selectedIndex = idx;
            SoundFX.tap();
            render();
          } else if (state.selectedIndex === idx) {
            state.selectedIndex = null;
            SoundFX.tap();
            render();
          } else {
            swapTiles(state.selectedIndex, idx);
          }
        });

        grid.appendChild(tile);
      });
    }

    function openModal(title, desc, showFullScene, buttons = null) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalDesc").textContent = desc;
      const mc = document.getElementById("modalCanvas");
      if (showFullScene) {
        mc.style.display = "block";
        drawPiece(mc, state.level, 0, 1, 1);
      } else {
        mc.style.display = "none";
      }

      const actionsEl = document.getElementById("modalActions");
      actionsEl.innerHTML = "";
      const list = buttons && buttons.length > 0
        ? buttons
        : [{ label: "Tamam", className: "primary-btn", onClick: () => closeModal() }];

      list.forEach((btnCfg) => {
        const b = document.createElement("button");
        b.className = btnCfg.className || "primary-btn";
        b.textContent = btnCfg.label;
        b.addEventListener("click", () => {
          SoundFX.tap();
          btnCfg.onClick();
        });
        actionsEl.appendChild(b);
      });

      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("soundBtn").addEventListener("click", () => {
      SoundFX.enabled = !SoundFX.enabled;
      const btn = document.getElementById("soundBtn");
      if (SoundFX.enabled) {
        btn.textContent = "🔊 Ses Açık";
        SoundFX.correct();
      } else {
        btn.textContent = "🔇 Kapalı";
      }
    });

    document.getElementById("goalBtn").addEventListener("click", () => {
      SoundFX.tap();
      const scene = SCENES[(state.level - 1) % SCENES.length];
      openModal("Hedef Sahne", `${state.level}. ${scene.title} — tüm parçaları doğru konumuna yerleştirin.`, true);
    });
    document.getElementById("thumbBox").addEventListener("click", () => document.getElementById("goalBtn").click());

    document.getElementById("dailyBtn").addEventListener("click", () => {
      SoundFX.tap();
      openModal("Günlük Bulmaca", "Bugünün özel ahşap ve epoksi sahnesi aktif! Bölümü tamamlayarak ekstra yıldız toplayabilirsiniz.", false);
    });

    document.getElementById("hintBtn").addEventListener("click", () => {
      if (state.score < 250) {
        SoundFX.warn();
        openModal("Yetersiz Puan", "İpucu almak için 250 puana ihtiyacınız var.", false);
        return;
      }
      const wrongIdx = state.tiles.findIndex((v, i) => v !== i);
      if (wrongIdx !== -1) {
        const targetPos = state.tiles.indexOf(wrongIdx);
        state.score -= 250;
        [state.tiles[wrongIdx], state.tiles[targetPos]] = [state.tiles[targetPos], state.tiles[wrongIdx]];
        SoundFX.correct();
        render();
      }
    });

    document.getElementById("extraMoveBtn").addEventListener("click", () => {
      if (state.score < 350) {
        SoundFX.warn();
        openModal("Yetersiz Puan", "+2 Hamle için 350 puana ihtiyacınız var.", false);
        return;
      }
      state.score -= 350;
      state.moves += 2;
      SoundFX.correct();
      render();
    });

    document.getElementById("rewardBtn").addEventListener("click", () => {
      grantRewardedMoves();
    });

    document.getElementById("backupBtn").addEventListener("click", () => {
      SoundFX.tap();
      openModal("İlerleme Kaydedildi", `Bölüm ${state.level}/50, ${state.score} Puan ve ${state.stars}/9 Yıldız yerel olarak kaydedildi.`, false);
    });

    document.getElementById("removeAdsBtn").addEventListener("click", () => {
      SoundFX.tap();
      openModal("Reklam Seçenekleri", "Test ve yayın sürümlerinde reklam kaldırma seçeneği mağaza yapılandırmasıyla bağlanabilir.", false);
    });

    setupLevel(1);
  </script>
