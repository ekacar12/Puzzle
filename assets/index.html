<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Puzzle</title>
  <style>
    :root {
      --bg-dark: #0e0a07;
      --wood-light: #c88a4b;
      --wood-mid: #9c612b;
      --wood-dark: #5e3412;
      --epoxy-cyan: #18b8d8;
      --epoxy-amber: #e59a24;
      --epoxy-emerald: #26b87c;
      --text-main: #f7efe4;
      --text-muted: #cbb9a3;
      --accent: #e59a24;
      --danger: #e0533c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(229, 154, 36, 0.14), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(24, 184, 216, 0.12), transparent 50%),
        linear-gradient(160deg, #17100a 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(42, 26, 13, 0.85);
      border: 1px solid rgba(200, 138, 75, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
      color: #ffd082;
    }

    .stats {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .pill {
      background: rgba(14, 10, 7, 0.75);
      border: 1px solid rgba(200, 138, 75, 0.3);
      border-radius: 999px;
      padding: 5px 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hud-card {
      background: linear-gradient(145deg, rgba(64, 39, 19, 0.85), rgba(31, 18, 9, 0.92));
      border: 1px solid rgba(200, 138, 75, 0.28);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
    }

    .hud-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .hud-value {
      font-size: 1.05rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .hud-value.low-moves {
      color: var(--danger);
    }

    .board-frame {
      background: linear-gradient(145deg, var(--wood-light), var(--wood-dark));
      padding: 12px;
      border-radius: 18px;
      box-shadow:
        inset 0 2px 3px rgba(255, 224, 178, 0.35),
        inset 0 -4px 8px rgba(20, 10, 3, 0.75),
        0 14px 30px rgba(0, 0, 0, 0.6);
    }

    .grid {
      display: grid;
      gap: 7px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .tile {
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      color: #fff8ed;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      background:
        linear-gradient(135deg, rgba(24, 184, 216, 0.28), rgba(229, 154, 36, 0.22)),
        linear-gradient(155deg, #b6763b, #6b3b14);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.35),
        0 4px 8px rgba(0, 0, 0, 0.45);
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.selected {
      outline: 3px solid #67f0ff;
      box-shadow: 0 0 16px rgba(24, 184, 216, 0.8);
      transform: scale(1.03);
      z-index: 2;
    }

    .tile.correct {
      background:
        linear-gradient(135deg, rgba(38, 184, 124, 0.35), rgba(24, 184, 216, 0.2)),
        linear-gradient(155deg, #a86c34, #582f0f);
      box-shadow:
        inset 0 0 0 1.5px rgba(102, 247, 186, 0.55),
        0 3px 7px rgba(0, 0, 0, 0.4);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button.btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 11px 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-main);
      background: rgba(58, 36, 18, 0.9);
      border: 1px solid rgba(200, 138, 75, 0.35);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    button.btn:active {
      transform: scale(0.97);
    }

    button.btn.primary {
      background: linear-gradient(135deg, #f0a830, #c87414);
      color: #160d05;
      border: none;
      font-weight: 800;
    }

    button.btn.ad-btn {
      background: linear-gradient(135deg, #18b8d8, #1278a8);
      color: #06131a;
      border: none;
      font-weight: 800;
    }

    .level-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .lvl-chip {
      min-width: 34px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(200, 138, 75, 0.28);
      background: rgba(34, 21, 11, 0.8);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .lvl-chip.active {
      background: var(--accent);
      color: #180e05;
      border-color: transparent;
    }

    .lvl-chip.done {
      border-color: rgba(38, 184, 124, 0.7);
      color: #7ef5c2;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(160deg, #2d1b0d, #160d07);
      border: 1px solid rgba(229, 154, 36, 0.45);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      color: #ffd48a;
    }

    .modal p {
      margin: 0 0 16px;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .status-toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 15, 8, 0.95);
      border: 1px solid rgba(229, 154, 36, 0.5);
      color: #ffe2ad;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 60;
    }

    .status-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="brand">Puzzle</div>
      <div class="stats">
        <div class="pill">⭐ <span id="scoreVal">0</span></div>
        <div class="pill">Bölüm <span id="levelBadge">1</span>/50</div>
      </div>
    </div>

    <div class="hud">
      <div class="hud-card">
        <div class="hud-label">Izgara</div>
        <div class="hud-value" id="gridVal">3×2</div>
      </div>
      <div class="hud-card">
        <div class="hud-label">Kalan Hamle</div>
        <div class="hud-value" id="movesVal">8</div>
      </div>
      <div class="hud-card">
        <div class="hud-label">Reklam Katkısı</div>
        <div class="hud-value" id="adBonusVal">+1 Hamle</div>
      </div>
    </div>

    <div class="board-frame">
      <div class="grid" id="boardGrid"></div>
    </div>

    <div class="actions">
      <button class="btn" id="restartBtn">Yeniden Başla</button>
      <button class="btn ad-btn" id="extraMoveTopBtn">Reklam İzle (+1 Hamle)</button>
    </div>

    <div class="level-strip" id="levelStrip"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle">Hamle Bitti!</h2>
      <p id="modalDesc">Bölümü tamamlamak için ekstra hamle alabilir veya ücretsiz yeniden başlayabilirsiniz.</p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="status-toast" id="toast"></div>

  <script>
    const TOTAL_LEVELS = 50;

    function getLevelConfig(level) {
      if (level <= 10) {
        return { level, cols: 3, rows: 2, moves: 8, adBonus: 1, label: '3×2' };
      }
      if (level <= 20) {
        return { level, cols: 3, rows: 3, moves: 11, adBonus: 1, label: '3×3' };
      }
      if (level <= 30) {
        return { level, cols: 4, rows: 4, moves: 19, adBonus: 2, label: '4×4' };
      }
      return { level, cols: 5, rows: 5, moves: 28, adBonus: 2, label: '5×5' };
    }

    let state = {
      currentLevel: 1,
      highestUnlocked: 1,
      completedLevels: [],
      score: 0,
      movesLeft: 8,
      tiles: [],
      selectedIndex: null,
      interstitialCounter: 0
    };

    const boardGrid = document.getElementById('boardGrid');
    const scoreVal = document.getElementById('scoreVal');
    const levelBadge = document.getElementById('levelBadge');
    const gridVal = document.getElementById('gridVal');
    const movesVal = document.getElementById('movesVal');
    const adBonusVal = document.getElementById('adBonusVal');
    const levelStrip = document.getElementById('levelStrip');
    const extraMoveTopBtn = document.getElementById('extraMoveTopBtn');
    const restartBtn = document.getElementById('restartBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalActions = document.getElementById('modalActions');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function sendAdCommand(payload) {
      if (window.AdBridge && typeof window.AdBridge.postMessage === 'function') {
        window.AdBridge.postMessage(JSON.stringify(payload));
        return true;
      }
      return false;
    }

    function requestRewardedAd(purpose) {
      const cfg = getLevelConfig(state.currentLevel);
      const sent = sendAdCommand({
        type: 'showRewarded',
        purpose,
        level: state.currentLevel,
        bonusMoves: cfg.adBonus
      });
      if (!sent) {
        // Tarayici onizleme modunda test simülasyonu
        window.onFlutterAdEvent('reward_earned', { purpose });
      }
    }

    function requestInterstitialAd() {
      state.interstitialCounter += 1;
      if (state.interstitialCounter % 2 !== 0) return;
      sendAdCommand({
        type: 'showInterstitial',
        level: state.currentLevel
      });
    }

    window.onFlutterAdEvent = function (eventName, payload = {}) {
      const cfg = getLevelConfig(state.currentLevel);
      if (eventName === 'reward_earned') {
        if (payload.purpose === 'double_reward') {
          const bonusPts = 25 * cfg.cols;
          state.score += bonusPts;
          updateHud();
          showToast(`+${bonusPts} ekstra puan eklendi!`);
          closeModal();
          goNextLevel();
        } else {
          state.movesLeft += cfg.adBonus;
          state.selectedIndex = null;
          closeModal();
          renderBoard();
          updateHud();
          showToast(`+${cfg.adBonus} ekstra hamle eklendi!`);
        }
      } else if (eventName === 'ad_not_ready' || eventName === 'ad_failed') {
        showToast('Reklam şu an hazır değil, kısa süre sonra tekrar deneyin.');
      }
    };

    function createShuffledTiles(count, seed) {
      const arr = Array.from({ length: count }, (_, i) => i + 1);
      let s = seed * 9301 + 49297;
      const rand = () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      if (arr.every((v, idx) => v === idx + 1)) {
        [arr[0], arr[arr.length - 1]] = [arr[arr.length - 1], arr[0]];
      }
      return arr;
    }

    function startLevel(levelNum) {
      state.currentLevel = Math.max(1, Math.min(TOTAL_LEVELS, levelNum));
      const cfg = getLevelConfig(state.currentLevel);
      const count = cfg.cols * cfg.rows;
      state.movesLeft = cfg.moves;
      state.tiles = createShuffledTiles(count, state.currentLevel * 17 + state.interstitialCounter);
      state.selectedIndex = null;
      closeModal();
      renderBoard();
      renderLevelStrip();
      updateHud();
    }

    function updateHud() {
      const cfg = getLevelConfig(state.currentLevel);
      scoreVal.textContent = state.score;
      levelBadge.textContent = state.currentLevel;
      gridVal.textContent = cfg.label;
      movesVal.textContent = state.movesLeft;
      movesVal.classList.toggle('low-moves', state.movesLeft <= 2);
      adBonusVal.textContent = `+${cfg.adBonus} Hamle`;
      extraMoveTopBtn.textContent = `Reklam İzle (+${cfg.adBonus} Hamle)`;
    }

    function renderBoard() {
      const cfg = getLevelConfig(state.currentLevel);
      boardGrid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
      boardGrid.style.gridTemplateRows = `repeat(${cfg.rows}, 1fr)`;
      boardGrid.innerHTML = '';

      state.tiles.forEach((val, idx) => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        if (val === idx + 1) btn.classList.add('correct');
        if (state.selectedIndex === idx) btn.classList.add('selected');
        btn.textContent = val;
        btn.addEventListener('click', () => onTileClick(idx));
        boardGrid.appendChild(btn);
      });
    }

    function renderLevelStrip() {
      levelStrip.innerHTML = '';
      for (let i = 1; i <= TOTAL_LEVELS; i++) {
        const chip = document.createElement('button');
        chip.className = 'lvl-chip';
        if (i === state.currentLevel) chip.classList.add('active');
        if (state.completedLevels.includes(i)) chip.classList.add('done');
        chip.textContent = i;
        chip.addEventListener('click', () => startLevel(i));
        levelStrip.appendChild(chip);
      }
      const activeChip = levelStrip.children[state.currentLevel - 1];
      if (activeChip) {
        activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function onTileClick(idx) {
      if (state.movesLeft <= 0) {
        openOutOfMovesModal();
        return;
      }

      if (state.selectedIndex === null) {
        state.selectedIndex = idx;
        renderBoard();
        return;
      }

      if (state.selectedIndex === idx) {
        state.selectedIndex = null;
        renderBoard();
        return;
      }

      const prevIdx = state.selectedIndex;
      [state.tiles[prevIdx], state.tiles[idx]] = [state.tiles[idx], state.tiles[prevIdx]];
      state.selectedIndex = null;
      state.movesLeft -= 1;

      renderBoard();
      updateHud();

      if (isSolved()) {
        onLevelWin();
      } else if (state.movesLeft <= 0) {
        openOutOfMovesModal();
      }
    }

    function isSolved() {
      return state.tiles.every((val, idx) => val === idx + 1);
    }

    function onLevelWin() {
      const cfg = getLevelConfig(state.currentLevel);
      const earned = cfg.cols * 10 + state.movesLeft * 5;
      state.score += earned;

      if (!state.completedLevels.includes(state.currentLevel)) {
        state.completedLevels.push(state.currentLevel);
      }
      if (state.currentLevel < TOTAL_LEVELS) {
        state.highestUnlocked = Math.max(state.highestUnlocked, state.currentLevel + 1);
      }

      updateHud();
      renderLevelStrip();
      requestInterstitialAd();

      modalTitle.textContent = `Bölüm ${state.currentLevel} Tamamlandı!`;
      modalDesc.textContent = `+${earned} puan kazandınız. İsterseniz ödüllü reklam izleyerek ekstra puan alabilir veya sonraki bölüme geçebilirsiniz.`;
      modalActions.innerHTML = '';

      const doubleBtn = document.createElement('button');
      doubleBtn.className = 'btn ad-btn';
      doubleBtn.textContent = `Reklam İzle (+${25 * cfg.cols} Puan) ve İlerle`;
      doubleBtn.onclick = () => requestRewardedAd('double_reward');

      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn primary';
      nextBtn.textContent = state.currentLevel < TOTAL_LEVELS ? 'Sonraki Bölüm' : 'Baştan Oyna';
      nextBtn.onclick = () => {
        closeModal();
        goNextLevel();
      };

      modalActions.appendChild(doubleBtn);
      modalActions.appendChild(nextBtn);
      openModal();
    }

    function goNextLevel() {
      if (state.currentLevel < TOTAL_LEVELS) {
        startLevel(state.currentLevel + 1);
      } else {
        startLevel(1);
      }
    }

    function openOutOfMovesModal() {
      const cfg = getLevelConfig(state.currentLevel);
      modalTitle.textContent = 'Hamle Bitti!';
      modalDesc.textContent = `Puanınız sıfır olsa bile bölümü ücretsiz yeniden deneyebilir veya reklam izleyerek +${cfg.adBonus} hamle alabilirsiniz.`;
      modalActions.innerHTML = '';

      const adBtn = document.createElement('button');
      adBtn.className = 'btn ad-btn';
      adBtn.textContent = `Reklam İzle (+${cfg.adBonus} Hamle)`;
      adBtn.onclick = () => requestRewardedAd('extra_moves');

      const retryBtn = document.createElement('button');
      retryBtn.className = 'btn primary';
      retryBtn.textContent = 'Ücretsiz Yeniden Başla';
      retryBtn.onclick = () => {
        requestInterstitialAd();
        startLevel(state.currentLevel);
      };

      modalActions.appendChild(adBtn);
      modalActions.appendChild(retryBtn);
      openModal();
    }

    function openModal() {
      modalBackdrop.classList.add('open');
    }

    function closeModal() {
      modalBackdrop.classList.remove('open');
    }

    restartBtn.addEventListener('click', () => {
      requestInterstitialAd();
      startLevel(state.currentLevel);
    });

    extraMoveTopBtn.addEventListener('click', () => {
      requestRewardedAd('extra_moves');
    });

    startLevel(1);
  </script>
</body>
</html>
