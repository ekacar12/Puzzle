<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ahşap ve Epoksi Puzzle</title>
  <style>
    :root {
      --bg-dark: #0b0907;
      --panel-bg: #17120e;
      --panel-border: #38281b;
      --wood-light: #d79b60;
      --wood-mid: #b3733b;
      --wood-dark: #6c3e1b;
      --epoxy-teal: #187a7a;
      --epoxy-light: #35b2aa;
      --gold: #f5b942;
      --text-main: #f7efe6;
      --text-muted: #b8a592;
      --accent-green: #27a86b;
      --accent-blue: #2788e8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: radial-gradient(circle at top, #1d150f 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6ee7b7;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-btn.gold {
      background: rgba(245, 185, 66, 0.16);
      border-color: rgba(245, 185, 66, 0.45);
      color: #ffd670;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-val {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .stat-val.gold {
      color: var(--gold);
    }

    .scene-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scene-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .level-badge {
      background: rgba(215, 155, 96, 0.18);
      border: 1px solid rgba(215, 155, 96, 0.45);
      color: #f6c88d;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 8px;
    }

    .correct-badge {
      font-size: 12px;
      font-weight: 700;
      color: #7ee7b7;
    }

    .scene-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .scene-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-action {
      background: none;
      border: none;
      color: #e9c496;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .target-thumb {
      width: 66px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(245, 185, 66, 0.65);
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    .target-thumb span {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.72);
      color: #ffd670;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .board-frame {
      background: linear-gradient(145deg, #2a190d, #150d07);
      border: 2px solid #4c301a;
      box-shadow: 0 0 0 1px rgba(53, 178, 170, 0.28), 0 12px 28px rgba(0, 0, 0, 0.65);
      border-radius: 18px;
      padding: 10px;
    }

    .board-grid {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .tile {
      position: relative;
      aspect-ratio: 1.15 / 1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 224, 178, 0.22);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .tile:active {
      transform: scale(0.97);
    }

    .tile.selected {
      border-color: #35b2aa;
      box-shadow: 0 0 0 2px rgba(53, 178, 170, 0.75);
      transform: scale(1.02);
      z-index: 2;
    }

    .tile.correct {
      border-color: #f5b942;
      box-shadow: 0 0 0 1px rgba(245, 185, 66, 0.55);
    }

    .check-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold);
      color: #1c1208;
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .hint-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .powerups-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .power-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      color: var(--text-main);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .power-cost {
      background: rgba(245, 185, 66, 0.16);
      color: #ffd670;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
    }

    .reward-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      background: linear-gradient(90deg, #e09f3e 0%, #f5b942 45%, #249e94 100%);
      color: #120d07;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 20px rgba(36, 158, 148, 0.28);
    }

    .reward-chip {
      background: rgba(0, 0, 0, 0.22);
      color: #fff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 30;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #1b140e;
      border: 1px solid #4a3320;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .primary-btn {
      background: linear-gradient(135deg, #27a86b, #1c8554);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-strip">
      <div class="status-dot" id="adStatus">Geçiş Reklamı: Hazır</div>
      <div style="display:flex; gap:6px;">
        <button class="pill-btn" id="backupBtn">☁️ Yedekle</button>
        <button class="pill-btn gold" id="removeAdsBtn">Reklamları Kaldır</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Bölüm</div>
        <div class="stat-val" id="levelText">1/50</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Puan</div>
        <div class="stat-val gold" id="scoreText">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hamle</div>
        <div class="stat-val" id="movesText">11</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kasa</div>
        <div class="stat-val gold" id="chestText">0/9 ★</div>
      </div>
    </div>

    <div class="scene-card">
      <div class="scene-top">
        <span class="level-badge" id="tierBadge">ÇIRAK • 3×2</span>
        <span class="correct-badge" id="correctText">0/6 Doğru</span>
      </div>
      <div class="scene-title" id="sceneTitle">1. Gün Batımı Fiyort &amp; Yelkenli</div>
      <div class="scene-meta">
        <div class="meta-actions">
          <button class="link-action" id="goalBtn">🔍 Hedefi Gör</button>
          <button class="link-action" id="dailyBtn">📅 Günlük Bulmaca</button>
        </div>
        <div class="target-thumb" id="thumbBox" title="Hedefi Gör">
          <canvas id="thumbCanvas" width="132" height="88" style="width:100%;height:100%;display:block;"></canvas>
          <span>HEDEF</span>
        </div>
      </div>
    </div>

    <div class="board-frame">
      <div class="board-grid" id="boardGrid"></div>
    </div>

    <div class="hint-bar">
      <span>Dokun veya seç • Doğru yer yıldızlanır</span>
      <span id="gridInfo">3×2 Kasa (6 Parça)</span>
    </div>

    <div class="powerups-row">
      <button class="power-btn" id="hintBtn">
        <span>💡 İpucu Al</span>
        <span class="power-cost">250 Puan</span>
      </button>
      <button class="power-btn" id="extraMoveBtn">
        <span>⚡ +2 Hamle</span>
        <span class="power-cost">350 Puan</span>
      </button>
    </div>

    <button class="reward-btn" id="rewardBtn">
      <span>🎬 Reklam İzle • Puan &amp; Kasa Kazan</span>
      <span class="reward-chip">+500 Puan 🎁</span>
    </button>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box">
      <h3 id="modalTitle" style="margin:0;color:#ffd670;">Hedef Sahne</h3>
      <canvas id="modalCanvas" width="300" height="200" style="width:100%;border-radius:12px;display:none;"></canvas>
      <p id="modalDesc" style="margin:0;font-size:13px;color:#e7dacb;line-height:1.45;"></p>
      <button class="primary-btn" id="modalCloseBtn">Tamam</button>
    </div>
  </div>

  <script>
    const SCENES = [
      { title: "Gün Batımı Fiyort & Yelkenli", skyTop: "#d98245", skyBot: "#f4c27a", waterTop: "#1f8a8a", waterBot: "#12545c", woodA: "#cf8e52", woodB: "#8a5226", pine: "#1e3a2f", sail: "#fff4dc", ring: "#e8b86d" },
      { title: "Zümrüt Epoksi & Çam Vadisi", skyTop: "#3d8b80", skyBot: "#9fd8c4", waterTop: "#197676", waterBot: "#0e434a", woodA: "#c48449", woodB: "#7d4920", pine: "#173328", sail: "#ffe8b3", ring: "#45d0c2" },
      { title: "Kehribar Gün Doğumu & Kıyı", skyTop: "#e07a38", skyBot: "#f8d38c", waterTop: "#258985", waterBot: "#134d56", woodA: "#d8985c", woodB: "#8f5629", pine: "#233d2b", sail: "#fff8eb", ring: "#f5b942" },
      { title: "Kuzey Fiyordu & Ahşap Köprü", skyTop: "#2c6e78", skyBot: "#8ec5c2", waterTop: "#15636b", waterBot: "#0b3842", woodA: "#be7d43", woodB: "#76431c", pine: "#152d26", sail: "#f7efe6", ring: "#73d2c8" }
    ];

    const state = {
      level: 1,
      score: 0,
      moves: 11,
      stars: 0,
      selectedIndex: null,
      tiles: []
    };

    function getLevelConfig(lvl) {
      const cols = lvl <= 4 ? 3 : (lvl <= 12 ? 3 : 4);
      const rows = lvl <= 4 ? 2 : (lvl <= 12 ? 3 : 3);
      const tier = lvl <= 5 ? "ÇIRAK" : (lvl <= 15 ? "USTA" : "MİMAR");
      const baseMoves = cols * rows + 5;
      return { cols, rows, tier, baseMoves };
    }

    function drawPiece(canvas, sceneIdx, pieceIdx, cols, rows) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const scene = SCENES[(sceneIdx - 1) % SCENES.length];

      const col = pieceIdx % cols;
      const row = Math.floor(pieceIdx / cols);
      const fullW = w * cols;
      const fullH = h * rows;

      ctx.save();
      ctx.translate(-col * w, -row * h);

      // Gökyüzü ve ahşap üst katman
      const skyGrad = ctx.createLinearGradient(0, 0, 0, fullH * 0.52);
      skyGrad.addColorStop(0, scene.skyTop);
      skyGrad.addColorStop(1, scene.skyBot);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, fullW, fullH * 0.52);

      // Ahşap damar çizgileri
      ctx.strokeStyle = scene.woodA;
      ctx.lineWidth = 2;
      for (let y = 12; y < fullH * 0.52; y += 14) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(fullW * 0.33, y - 5, fullW * 0.66, y + 5, fullW, y);
        ctx.stroke();
      }

      // Epoksi su yüzeyi
      const seaGrad = ctx.createLinearGradient(0, fullH * 0.5, 0, fullH);
      seaGrad.addColorStop(0, scene.waterTop);
      seaGrad.addColorStop(1, scene.waterBot);
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, fullH * 0.5, fullW, fullH * 0.5);

      // Fiyort kıyı şeridi ve çam ağaçları
      ctx.fillStyle = scene.woodB;
      ctx.beginPath();
      ctx.moveTo(0, fullH * 0.52);
      ctx.lineTo(fullW * 0.45, fullH * 0.45);
      ctx.lineTo(fullW * 0.72, fullH * 0.58);
      ctx.lineTo(0, fullH * 0.68);
      ctx.closePath();
      ctx.fill();

      for (let i = 0; i < 4; i++) {
        const tx = fullW * (0.14 + i * 0.13);
        const ty = fullH * (0.48 - (i % 2) * 0.04);
        ctx.fillStyle = scene.pine;
        ctx.beginPath();
        ctx.moveTo(tx, ty - 28);
        ctx.lineTo(tx - 13, ty);
        ctx.lineTo(tx + 13, ty);
        ctx.closePath();
        ctx.fill();
      }

      // Yelkenli silüeti
      const bx = fullW * 0.66;
      const by = fullH * 0.62;
      ctx.fillStyle = scene.sail;
      ctx.beginPath();
      ctx.moveTo(bx, by - 36);
      ctx.lineTo(bx + 26, by - 4);
      ctx.lineTo(bx, by - 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = scene.woodB;
      ctx.fillRect(bx - 14, by - 4, 44, 7);

      // Dekoratif epoksi halkaları
      ctx.strokeStyle = scene.ring;
      ctx.lineWidth = 2.5;
      for (let r = 0; r < 5; r++) {
        const rx = fullW * (0.2 + r * 0.16);
        const ry = fullH * (0.26 + (r % 2) * 0.44);
        ctx.beginPath();
        ctx.ellipse(rx, ry, 14, 7, (r - 2) * 0.25, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function setupLevel(lvl) {
      const cfg = getLevelConfig(lvl);
      const total = cfg.cols * cfg.rows;
      const arr = Array.from({ length: total }, (_, i) => i);

      // En az birkaç parçanın karışık olmasını sağla
      do {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      } while (arr.every((v, idx) => v === idx));

      state.level = lvl;
      state.moves = cfg.baseMoves;
      state.selectedIndex = null;
      state.tiles = arr;
      render();
    }

    function swapTiles(a, b) {
      if (a === b || state.moves <= 0) return;
      [state.tiles[a], state.tiles[b]] = [state.tiles[b], state.tiles[a]];
      state.moves -= 1;
      state.selectedIndex = null;

      if (state.tiles[b] === b) {
        state.score += 100;
      }

      const solved = state.tiles.every((val, idx) => val === idx);
      if (solved) {
        state.score += 300;
        state.stars = Math.min(9, state.stars + 1);
        openModal("Bölüm Tamamlandı!", `${state.level}. bölümü tamamladınız! +300 puan ve +1 yıldız kazandınız.`, false);
        const nextLvl = state.level < 50 ? state.level + 1 : 1;
        setTimeout(() => setupLevel(nextLvl), 400);
        return;
      }

      if (state.moves <= 0) {
        openModal("Hamle Bitti", "Reklam izleyerek +500 puan kazanabilir veya bölümü yeniden başlatabilirsiniz.", false);
        setupLevel(state.level);
        return;
      }

      render();
    }

    function render() {
      const cfg = getLevelConfig(state.level);
      const scene = SCENES[(state.level - 1) % SCENES.length];
      const total = cfg.cols * cfg.rows;
      const correctCount = state.tiles.filter((val, idx) => val === idx).length;

      document.getElementById("levelText").textContent = `${state.level}/50`;
      document.getElementById("scoreText").textContent = `${state.score}`;
      document.getElementById("movesText").textContent = `${state.moves}`;
      document.getElementById("chestText").textContent = `${state.stars}/9 ★`;
      document.getElementById("tierBadge").textContent = `${cfg.tier} • ${cfg.cols}×${cfg.rows}`;
      document.getElementById("correctText").textContent = `${correctCount}/${total} Doğru`;
      document.getElementById("sceneTitle").textContent = `${state.level}. ${scene.title}`;
      document.getElementById("gridInfo").textContent = `${cfg.cols}×${cfg.rows} Sahne (${total} Parça)`;

      drawPiece(document.getElementById("thumbCanvas"), state.level, 0, 1, 1);

      const grid = document.getElementById("boardGrid");
      grid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
      grid.innerHTML = "";

      state.tiles.forEach((pieceVal, idx) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        if (state.selectedIndex === idx) tile.classList.add("selected");
        if (pieceVal === idx) tile.classList.add("correct");

        const c = document.createElement("canvas");
        c.width = 160;
        c.height = 140;
        c.style.width = "100%";
        c.style.height = "100%";
        c.style.display = "block";
        drawPiece(c, state.level, pieceVal, cfg.cols, cfg.rows);
        tile.appendChild(c);

        if (pieceVal === idx) {
          const badge = document.createElement("div");
          badge.className = "check-badge";
          badge.textContent = "✓";
          tile.appendChild(badge);
        }

        tile.addEventListener("click", () => {
          if (state.selectedIndex === null) {
            state.selectedIndex = idx;
            render();
          } else if (state.selectedIndex === idx) {
            state.selectedIndex = null;
            render();
          } else {
            swapTiles(state.selectedIndex, idx);
          }
        });

        grid.appendChild(tile);
      });
    }

    function openModal(title, desc, showFullScene) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalDesc").textContent = desc;
      const mc = document.getElementById("modalCanvas");
      if (showFullScene) {
        mc.style.display = "block";
        drawPiece(mc, state.level, 0, 1, 1);
      } else {
        mc.style.display = "none";
      }
      document.getElementById("modalBackdrop").classList.add("open");
    }

    document.getElementById("modalCloseBtn").addEventListener("click", () => {
      document.getElementById("modalBackdrop").classList.remove("open");
    });

    document.getElementById("goalBtn").addEventListener("click", () => {
      const scene = SCENES[(state.level - 1) % SCENES.length];
      openModal("Hedef Sahne", `${state.level}. ${scene.title} — tüm parçaları doğru konumuna yerleştirin.`, true);
    });
    document.getElementById("thumbBox").addEventListener("click", () => document.getElementById("goalBtn").click());

    document.getElementById("dailyBtn").addEventListener("click", () => {
      openModal("Günlük Bulmaca", "Bugünün özel ahşap ve epoksi sahnesi aktif! Bölümü tamamlayarak ekstra yıldız toplayabilirsiniz.", false);
    });

    document.getElementById("hintBtn").addEventListener("click", () => {
      if (state.score < 250) {
        openModal("Yetersiz Puan", "İpucu almak için 250 puana ihtiyacınız var. Reklam izleyerek puan kazanabilirsiniz.", false);
        return;
      }
      const wrongIdx = state.tiles.findIndex((v, i) => v !== i);
      if (wrongIdx !== -1) {
        const targetPos = state.tiles.indexOf(wrongIdx);
        state.score -= 250;
        [state.tiles[wrongIdx], state.tiles[targetPos]] = [state.tiles[targetPos], state.tiles[wrongIdx]];
        render();
      }
    });

    document.getElementById("extraMoveBtn").addEventListener("click", () => {
      if (state.score < 350) {
        openModal("Yetersiz Puan", "+2 Hamle için 350 puana ihtiyacınız var.", false);
        return;
      }
      state.score -= 350;
      state.moves += 2;
      render();
    });

    document.getElementById("rewardBtn").addEventListener("click", () => {
      state.score += 500;
      state.moves += 2;
      state.stars = Math.min(9, state.stars + 1);
      document.getElementById("adStatus").textContent = "Ödül Verildi (+500 Puan)";
      render();
    });

    document.getElementById("backupBtn").addEventListener("click", () => {
      openModal("İlerleme Kaydedildi", `Bölüm ${state.level}/50, ${state.score} Puan ve ${state.stars}/9 Yıldız yerel olarak kaydedildi.`, false);
    });

    document.getElementById("removeAdsBtn").addEventListener("click", () => {
      openModal("Reklam Seçenekleri", "Test ve yayın sürümlerinde reklam kaldırma seçeneği mağaza yapılandırmasıyla bağlanabilir.", false);
    });

    setupLevel(1);
  </script>
</body>
</html>
