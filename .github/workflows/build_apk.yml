name: Build Puzzle APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android platform exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Android lint abort on release
        run: |
          node -e '
            const fs = require("fs");
            for (const p of ["android/app/build.gradle.kts", "android/app/build.gradle"]) {
              if (fs.existsSync(p)) {
                let s = fs.readFileSync(p, "utf8");
                if (!s.includes("abortOnError")) {
                  s = s.replace("android {", "android {\n  lint {\n    abortOnError = false\n    checkReleaseBuilds = false\n  }");
                  fs.writeFileSync(p, s, "utf8");
                }
              }
            }
          '

      - name: Decode release keystore and create key.properties
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEY_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release-key.jks
          ls -lh android/app/release-key.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-key.jks
          EOF

      - name: Build signed release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=1 \
            --build-name=1.0.0
          ls -lh build/app/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/ahsap-ve-epoksi-puzzle.aab

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK copy
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ahsap-ve-epoksi-puzzle.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-aab
          path: dist/ahsap-ve-epoksi-puzzle.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-apk
          path: dist/ahsap-ve-epoksi-puzzle.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Ahşap ve Epoksi Puzzle - Güncel APK"
          body: "Otomatik derlenen en güncel Android APK sürümü."
          files: dist/ahsap-ve-epoksi-puzzle.apk
          make_latest: true
          draft: false
          prerelease: false
