name: Build Puzzle APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android platform exists
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Android lint abort on release
        run: |
          node -e '
            const fs = require("fs");
            for (const p of ["android/app/build.gradle.kts", "android/app/build.gradle"]) {
              if (fs.existsSync(p)) {
                let s = fs.readFileSync(p, "utf8");
                if (!s.includes("abortOnError")) {
                  s = s.replace("android {", "android {\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }");
                  fs.writeFileSync(p, s, "utf8");
                }
              }
            }
          '

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK copy
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ahsap-ve-epoksi-puzzle.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-apk
          path: dist/ahsap-ve-epoksi-puzzle.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Ahşap ve Epoksi Puzzle - Güncel APK"
          body: "Otomatik derlenen en güncel Android APK sürümü."
          files: dist/ahsap-ve-epoksi-puzzle.apk
          make_latest: true
          draft: false
          prerelease: false
