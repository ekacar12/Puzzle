      - name: Build release APK
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            python3 -c '
p = "android/app/build.gradle.kts"
s = open(p).read()
if "lint {" not in s:
    s = s.replace("android {", "android {\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }", 1)
    open(p, "w").write(s)
'
          elif [ -f "android/app/build.gradle" ]; then
            python3 -c '
p = "android/app/build.gradle"
s = open(p).read()
if "lint {" not in s:
    s = s.replace("android {", "android {\n    lint {\n        abortOnError false\n        checkReleaseBuilds false\n    }", 1)
    open(p, "w").write(s)
'
          fi
          flutter build apk --release
