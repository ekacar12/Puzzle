name: Generate Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and print Base64
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Erdal Kacar, OU=Mobile, O=Puzzle, L=Kocaeli, ST=Kocaeli, C=TR"

          echo "=== BASE64 START ==="
          base64 -w 0 release-key.jks
          echo ""
          echo "=== BASE64 END ==="
